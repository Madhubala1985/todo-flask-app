{% extends 'base.html' %}
{% block title %}Project{% endblock %}
{% block content %}
<h2>{{ project.name }}</h2>
<ul>
    {% for task in tasks %}
      <li>
        <form method="post" action="{{ url_for('main.toggle_task', task_id=task.id) }}" style="display:inline">
          <button type="submit">{% if task.complete %}Undo{% else %}Done{% endif %}</button>
        </form>
        {% if task.complete %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
      </li>
    {% endfor %}
</ul>
<form method="post" action="{{ url_for('main.add_task', project_id=project.id) }}">
    <input type="text" name="title" placeholder="New Task" required>
    <button type="submit">Add Task</button>
</form>
<a href="{{ url_for('main.dashboard') }}">Back to Dashboard</a>
{% endblock %}
